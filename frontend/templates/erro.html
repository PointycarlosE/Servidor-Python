<!--erro.html-->
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Meu Drive Pessoal</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                window.__initialTheme = savedTheme;
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-simple">
    <header class="header-simple">
        <nav class="header-nav">
            <a href="{{ url_for('file.explorar') }}">
                <i data-lucide="folder" style="width:16px;height:16px;"></i> Explorador
            </a>
            <a href="{{ url_for('main.objetivos') }}">
                <i data-lucide="list-checks" style="width:16px;height:16px;"></i> Objetivos
            </a>
        </nav>
        <div class="header-actions">
            <button id="theme-toggle" class="theme-btn-simple" aria-label="Alternar tema">
                <span class="theme-icon"><i data-lucide="sun" id="icon-theme"></i></span>
            </button>
        </div>
    </header>

    <main class="content-centered">
        <div class="error-container">
            <div class="error-icon">
                <i data-lucide="triangle-alert" style="width:64px;height:64px;color:#f59e0b;"></i>
            </div>
            <h1 class="error-title">Ocorreu um erro</h1>
            <p class="error-message">{{ mensagem }}</p>
            <div class="error-actions">
                <a href="{{ url_for('file.explorar') }}" class="btn-primary" style="display:inline-flex;gap:8px;width:auto;padding:12px 28px;">
                    <i data-lucide="folder" style="width:18px;height:18px;"></i> Voltar para Explorador
                </a>
            </div>
        </div>
    </main>

    <footer class="footer-simple">
        <p>Meu Drive Pessoal © 2024 - Seu repositório de arquivos</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        lucide.createIcons();
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            const iconTheme = document.getElementById('icon-theme');
            const cur = document.documentElement.getAttribute('data-theme') || 'light';
            iconTheme.setAttribute('data-lucide', cur === 'dark' ? 'moon' : 'sun');
            lucide.createIcons();
            themeToggle.addEventListener('click', () => {
                const c = document.documentElement.getAttribute('data-theme') || 'light';
                const n = c === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', n);
                localStorage.setItem('theme', n);
                iconTheme.setAttribute('data-lucide', n === 'dark' ? 'moon' : 'sun');
                lucide.createIcons();
            });
        }
    </script>
</body>
</html>
