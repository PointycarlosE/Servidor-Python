<!-- erro.html -->
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Erro — Meu Drive</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width: 500px; text-align: center;">
            <div class="auth-header">
                <div class="auth-logo" style="background: var(--danger-light); color: var(--danger);">
                    <i data-lucide="alert-triangle" style="width: 32px; height: 32px;"></i>
                </div>
                <h1>Ops! Algo deu errado</h1>
                <p>Encontramos uma instabilidade ao processar sua solicitação.</p>
            </div>

            <div class="auth-body">
                <div class="alert alert-error" style="margin-bottom: 24px; text-align: left;">
                    <i data-lucide="info"></i>
                    <span>{{ mensagem or 'Ocorreu um erro inesperado no servidor. Por favor, tente novamente.' }}</span>
                </div>

                <div style="display: flex; gap: 12px; flex-direction: column;">
                    <a href="{{ url_for('file.explorar') }}" class="btn btn-primary" style="width: 100%;">
                        <i data-lucide="home"></i> Ir para Meus arquivos
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary" style="width: 100%;">
                        <i data-lucide="arrow-left"></i> Voltar à página anterior
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
