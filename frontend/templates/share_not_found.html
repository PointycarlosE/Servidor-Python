<!-- share_not_found.html -->
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Arquivo Não Encontrado — Meu Drive</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width: 460px; text-align: center;">
            <div class="auth-header">
                <div class="auth-logo" style="background: var(--danger-light); color: var(--danger);">
                    <i data-lucide="file-x" style="width: 32px; height: 32px;"></i>
                </div>
                <h1>Arquivo Não Encontrado</h1>
                <p>O arquivo compartilhado foi removido, renomeado ou excluído permanentemente.</p>
            </div>

            <div class="auth-body">
                <div class="alert alert-error" style="margin-bottom: 20px; justify-content: center;">
                    <span>Verifique o link ou entre em contato com quem enviou o compartilhamento.</span>
                </div>
                <a href="{{ url_for('auth.login') }}" class="btn btn-secondary" style="width: 100%;">
                    <i data-lucide="arrow-left"></i> Acessar Meu Drive
                </a>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
