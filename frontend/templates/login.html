<!-- login.html -->
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrar — Meu Drive Pessoal</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <style>
        .auth-theme-toggle {
            position: absolute;
            top: calc(16px + var(--sat));
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-fast);
            z-index: 10;
        }
        .auth-theme-toggle:hover {
            background: var(--surface-hover);
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <!-- Alternador de tema -->
        <button class="auth-theme-toggle" id="theme-toggle" title="Alternar tema">
            <i data-lucide="sun" id="theme-icon"></i>
        </button>

        <div class="auth-card">
            <!-- Cabeçalho -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i data-lucide="cloud" style="width: 32px; height: 32px;"></i>
                </div>
                <h1>Meu Drive</h1>
                <p>Faça login para gerenciar e acessar seus arquivos com segurança.</p>
            </div>

            <!-- Mensagens Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div style="padding: 0 32px 16px;">
                {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else 'error' if category == 'error' else 'info' }}" style="margin: 0;">
                    <i data-lucide="{{ 'check-circle' if category == 'success' else 'alert-circle' if category == 'error' else 'info' }}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- Formulário -->
            <form method="POST" id="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="auth-body">
                    <!-- Usuário -->
                    <div class="form-group">
                        <label for="username" class="form-label">
                            <i data-lucide="user"></i> Usuário
                        </label>
                        <input type="text" name="username" id="username" class="form-input" placeholder="Seu nome de usuário" required autofocus autocomplete="username">
                        <div class="form-error" id="username-error" style="display: none;"></div>
                    </div>

                    <!-- Senha -->
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="password" class="form-label">
                                <i data-lucide="lock"></i> Senha
                            </label>
                            <a href="{{ url_for('auth.esqueceu_senha') }}" style="font-size: 0.8125rem; color: var(--primary); font-weight: 500;">Esqueceu?</a>
                        </div>
                        <div class="password-wrapper">
                            <input type="password" name="password" id="password" class="form-input" placeholder="Sua senha" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-senha" id="btn-toggle-password" title="Mostrar/ocultar senha">
                                <i data-lucide="eye" id="icon-toggle-password"></i>
                            </button>
                        </div>
                        <div class="form-error" id="password-error" style="display: none;"></div>
                    </div>

                    <!-- Lembrar de mim -->
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label class="radio-option" style="padding: 8px 12px; border-radius: var(--radius-sm);">
                            <input type="checkbox" name="remember" id="remember" style="accent-color: var(--primary); width: 16px; height: 16px;">
                            <span style="font-size: 0.875rem;">Manter conectado por 7 dias</span>
                        </label>
                    </div>

                    <!-- Botão Entrar -->
                    <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 0.95rem;">
                        <i data-lucide="log-in"></i> Entrar no Drive
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        lucide.createIcons();

        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle?.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (themeIcon) {
                themeIcon.setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
                lucide.createIcons();
            }
        }

        // Toggle senha
        const btnToggle = document.getElementById('btn-toggle-password');
        const passwordInput = document.getElementById('password');

        if (btnToggle && passwordInput) {
            btnToggle.addEventListener('click', (e) => {
                e.preventDefault();
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';

                btnToggle.innerHTML = '';
                const newIcon = document.createElement('i');
                newIcon.id = 'icon-toggle-password';
                newIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
                btnToggle.appendChild(newIcon);
                lucide.createIcons();
            });
        }
    </script>
</body>
</html>
