<!-- esqueceu_senha.html -->
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Esqueceu a Senha — Meu Drive</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <style>
        .auth-theme-toggle {
            position: absolute;
            top: calc(16px + var(--sat));
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-fast);
            z-index: 10;
        }
        .auth-theme-toggle:hover {
            background: var(--surface-hover);
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <!-- Alternador de tema -->
        <button class="auth-theme-toggle" id="theme-toggle" title="Alternar tema">
            <i data-lucide="sun" id="theme-icon"></i>
        </button>

        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo" style="background: var(--warning-light); color: var(--warning);">
                    <i data-lucide="key-round" style="width: 32px; height: 32px;"></i>
                </div>
                <h1>Esqueceu a Senha?</h1>
                <p>Digite seu e-mail cadastrado para receber o link de redefinição.</p>
            </div>

            <!-- Alertas -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div style="padding: 0 32px 16px;">
                {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else 'error' if category == 'error' else 'info' }}" style="margin: 0;">
                    <i data-lucide="{{ 'check-circle' if category == 'success' else 'alert-circle' if category == 'error' else 'info' }}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- Formulário -->
            <form method="POST" id="forgot-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="auth-body">
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i data-lucide="mail"></i> E-mail
                        </label>
                        <input type="email" name="email" id="email" class="form-input" placeholder="seu-email@exemplo.com" required autofocus autocomplete="email">
                        <div class="form-error" id="email-error" style="display: none;"></div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 0.95rem;">
                        <i data-lucide="send"></i> Enviar Link de Recuperação
                    </button>
                </div>

                <div class="auth-footer">
                    <span>Lembrou da senha? <a href="{{ url_for('auth.login') }}">Fazer Login</a></span>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        lucide.createIcons();

        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle?.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (themeIcon) {
                themeIcon.setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
